<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه من</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 p-4 flex justify-between items-center">
        <h1 class="font-bold text-lg text-indigo-600">فروشگاه مینی‌اپ</h1>
        <button onclick="toggleCart()" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-1">
            🛒 سبد خرید (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto">
        <div class="mb-6 bg-gradient-to-r from-indigo-500 to-violet-600 text-white p-4 rounded-2xl shadow-lg">
            <h2 class="text-xl font-bold mb-1">خرید آنی و مطمئن</h2>
            <p class="text-xs text-indigo-100">بهترین اکانت‌ها و خدمات دیجیتال با تحویل خودکار</p>
        </div>

        <h3 class="font-bold text-md mb-3 text-slate-700">محصولات پرطرفدار</h3>
        
        <!-- Products Grid -->
        <div id="product-list" class="grid grid-cols-2 gap-3">
            <!-- Product 1 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="bg-indigo-50 h-28 rounded-xl mb-2 flex items-center justify-center text-3xl">🎮</div>
                    <h4 class="font-bold text-sm text-slate-800">گیم‌پاس آلتیمیت</h4>
                    <p class="text-xs text-slate-400 mt-1">اشتراک ۱ ماهه ترکیه</p>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-xs font-bold text-indigo-600">۳۵۰,۰۰۰ تومان</span>
                    <button onclick="addToCart('گیم‌پاس آلتیمیت', 350000)" class="bg-indigo-600 text-white w-8 h-8 rounded-xl flex items-center justify-center text-lg">+</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="bg-violet-50 h-28 rounded-xl mb-2 flex items-center justify-center text-3xl">🤖</div>
                    <h4 class="font-bold text-sm text-slate-800">اکانت چت‌جی‌پیتی</h4>
                    <p class="text-xs text-slate-400 mt-1">نسخه پلاس اختصاصی</p>
                </div>
                <div class="mt-4 flex items-center justify-between">
                    <span class="text-xs font-bold text-indigo-600">۲,۳۰۰,۰۰۰ ت</span>
                    <button onclick="addToCart('اکانت چت‌جی‌پیتی', 2300000)" class="bg-indigo-600 text-white w-8 h-8 rounded-xl flex items-center justify-center text-lg">+</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Modal / Section -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-5 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">سبد خرید شما</h3>
                <button onclick="toggleCart()" class="text-slate-400 font-bold">✕</button>
            </div>
            <div id="cart-items" class="space-y-3 mb-4">
                <!-- Items will be injected here -->
            </div>
            <div class="border-t pt-3 mb-4 flex justify-between font-bold">
                <span>مجموع قابل پرداخت:</span>
                <span id="total-price" class="text-indigo-600">۰ تومان</span>
            </div>
            <button onclick="checkout()" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold shadow-lg shadow-indigo-100">ثبت سفارش و کارت به کارت</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            let container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-4">سبد خرید شما خالی است</p>';
            }

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                        <div>
                            <h5 class="font-bold text-sm">${item.name}</h5>
                            <span class="text-xs text-slate-500">${item.price.toLocaleString()} تومان</span>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 text-xs">حذف</button>
                    </div>
                `;
            });
            document.getElementById('total-price').innerText = total.toLocaleString() + ' تومان';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            let modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkout() {
            if(cart.length === 0) {
                alert('سبد خرید شما خالی است!');
                return;
            }
            alert('سفارش شما با موفقیت ثبت شد! لطفاً جهت واریز وجه اقدام کنید.');
            cart = [];
            updateCartUI();
            toggleCart();
        }
    </script>
</body>
              </html>
